<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Switch Operations{% endblock %}</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("snmpdash-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (error) { /* private mode / storage disabled */ }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('overview') }}" aria-label="Switch Operations home">
        <span class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="brand-copy">
          <strong>Oran<span>Lab</span></strong>
          <small>Switch Operations</small>
        </span>
      </a>

      <nav class="mainnav" aria-label="Primary">
        <a href="{{ url_for('overview') }}" class="{{ 'active' if active == 'overview' else '' }}">Overview</a>
        {% for item in switches %}
        <a href="{{ url_for('switch_page', switch_id=item.id) }}"
           class="{{ 'active' if active_switch == item.id else '' }}">{{ item.name }}</a>
        {% endfor %}
      </nav>

      <div class="topbar-right">
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
          </svg>
          <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
          <span id="theme-toggle-label">Dark</span>
        </button>
        <span class="live-indicator" id="live-indicator">
          <span class="live-dot"></span><span id="live-label">Live</span>
        </span>
        <span class="refresh-note">{{ refresh }}s refresh</span>
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}

  <footer class="site-footer">
    <span>SNMP switch operations console</span>
    <span class="footer-sep">·</span>
    <span>Hardware, port and optical telemetry</span>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
